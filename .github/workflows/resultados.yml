name: Actualizar resultados

on:
  schedule:
    # 07:00 y 01:30 aprox. hora de Chile (después de los partidos nocturnos)
    - cron: "0 10 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer la ficha del club en lnbchile.com
        run: python scripts/actualizar_resultados.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- public/datos/resultados.js; then
            echo "Sin resultados nuevos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/datos/resultados.js
            git commit -m "Actualizar resultados desde la LNB"
            git push
          fi
